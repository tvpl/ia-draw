# Mapa de capacidades (TRU-01)
#
# Contrato entre o que a documentação de produto afirma e o que existe no
# código. Cada capacidade anunciada no README ou em docs/architecture-overview.html
# tem exatamente uma entrada aqui.
#
# Campos obrigatórios em toda entrada:
#   capability        nome da capacidade como a documentação a apresenta
#   requirements      IDs de .specs/features/architecture-canvas/spec.md
#   backend_evidence  arquivo que implementa a capacidade no servidor
#   ui_surface        arquivo em apps/web/src que a expõe ao usuário final,
#                     ou null — e nesse caso `status: backend-only` é obrigatório
#
# `backend-only` significa: o contrato de backend está verificado, o usuário
# final não tem por onde acessar. Não descreva essas capacidades como entregues.
#
# Verificado por `repo-tools audit` (TRU-03). Estado hoje: 4 das 82 rotas REST
# registradas têm consumidor de UI, e 78 não têm — 4 + 78 = 82.

capabilities:
  - capability: Instalação self-hosted com stack completo
    requirements: [FND-01, FND-02, FND-03, FND-04, FND-05]
    backend_evidence: infra/compose/compose.yaml
    ui_surface: null
    status: backend-only

  - capability: Sessão autenticada no editor
