# Serves the pre-built Vite SPA. The compose `proxy` service (Caddy) is the
# single public entrypoint; this container only needs to answer on :80 for
# whatever the proxy forwards to it (path rewriting, if any, happens there).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
